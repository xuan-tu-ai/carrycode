[project]
name = "carrycode"
version = "0.0.1"
description = "An open reimplementation of CarryOn-style object-oriented context for long-horizon coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Nguyen Xuan Tu", email = "nxuantu36@gmail.com" }]
dependencies = [
    "litellm<1.106",
    "mini-swe-agent>=2.4.6",
    "pydantic>=2.0",
    "pyyaml",
    "typer",
]

[project.urls]
Repository = "https://github.com/xuan-tu-ai/carrycode"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carrycode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs"]  # ruff also formats code blocks in Markdown; task specs hold pseudo-code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
