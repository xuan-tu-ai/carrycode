# Ablation: CarryOn with only existence/diff checks, no test or compile checks.
# Measures the contribution of the content-level Grounder.
name: carryon_no_code_checks
agent: carryon
models: configs/models/haiku.yaml
agent_config: swebench
step_limit: 250
cost_limit: 3.0
runtime:
  trigger_tokens: 24000          # 6000 was OSWorld; coding uses 24k + 8k kept tokens to avoid file re-reads
  keep_recent_tokens: 8000       # keep recent live tail to preserve working set
  max_requests_per_scan: 4
  use_code_checks: false
