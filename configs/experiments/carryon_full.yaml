# Full CarryOn with coding Grounder checks (tests, compile, git diff).
name: carryon_full
agent: carryon
models: configs/models/haiku.yaml
agent_config: swebench
step_limit: 250
cost_limit: 3.0
runtime:
  trigger_tokens: 24000          # paper App. A.3 used 6000 for OSWorld; coding uses 24k + 8k kept tokens to avoid file re-reads
  keep_recent_tokens: 8000       # keep recent live tail to preserve working set
  max_requests_per_scan: 4       # paper Table 7
  use_code_checks: true
