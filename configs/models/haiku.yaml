# Claude Haiku 5.5 via Token Harbor (OpenAI-compatible, Agent Pass plan), used for the host agent and the runtime roles.
# Confirmed 2026-10-23 with GET https://tokenharbor.ai/v1/models: claude-haiku-5.5, $0.10/M input, $0.50/M output,
# 1M context, tool calls. Live check: plain, bash tool call and JSON mode all succeed (JSON arrives fenced in ```json;
# RoleLLM strips the fence).
api_key_env: TOKENHARBOR_API_KEY          # copied to OPENAI_API_KEY at startup (never written to trajectories)
price_registry: configs/models/litellm_registry.json

host:
  model_name: "openai/claude-haiku-5.5"
  model_kwargs:
    api_base: "https://tokenharbor.ai/v1"
    drop_params: true
    temperature: 0.0
    timeout: 600
    reasoning_effort: "max"
  cost_tracking: "default"

runtime:
  model_name: "openai/claude-haiku-5.5"
  model_kwargs:
    api_base: "https://tokenharbor.ai/v1"
    drop_params: true
    temperature: 0.0
    timeout: 600
    reasoning_effort: "max"
