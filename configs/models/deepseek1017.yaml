# DeepSeek V4.1 Flash 1017 via Token Harbor (OpenAI-compatible, Agent Pass plan), used for the host agent and the runtime roles.
# Confirmed 2026-10-23 with GET https://tokenharbor.ai/v1/models: deepseek-v4.1-flash-1017, $0.30/M input, $1.20/M output,
# $0.03/M cache read, 1M context, tool calls. LiteLLM sends `reasoning_effort: max` through Token Harbor without error.
api_key_env: TOKENHARBOR_API_KEY          # copied to OPENAI_API_KEY at startup (never written to trajectories)
price_registry: configs/models/litellm_registry.json

host:
  model_name: "openai/deepseek-v4.1-flash-1017"
  model_kwargs:
    api_base: "https://tokenharbor.ai/v1"
    drop_params: true
    temperature: 0.0
    timeout: 600
    reasoning_effort: "max"
  cost_tracking: "default"

runtime:
  model_name: "openai/deepseek-v4.1-flash-1017"
  model_kwargs:
    api_base: "https://tokenharbor.ai/v1"
    drop_params: true
    temperature: 0.0
    timeout: 600
    reasoning_effort: "max"